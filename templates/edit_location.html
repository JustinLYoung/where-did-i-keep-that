
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Storage Location</title>
</head>

<body>

    <h1>Edit Storage Location</h1>

    <form method="POST">

        <label>Location Name:</label>
        <input
            type="text"
            name="location_name"
            value="{{ location[1] }}"
            required
        >

        <br><br>

        <label>Description:</label>
        <input
            type="text"
            name="description"
            value="{{ location[2] or '' }}"
        >

        <br><br>

        <button type="submit">Save Changes</button>

    </form>

    <br>

    <a href="{{ url_for('home') }}">Cancel</a>

</body>
</html>
